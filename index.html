<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="menu">
        <div class="menu-btn">☰</div>
        <h1>LOG</h1>
    </header>

    <!-- Tela de Login -->
    <section class="tela" id="loginTela">
        <div class="card">
            <div class="logo">🎮<h2>LOG</h2></div>
            <form>
                <label>Email</label>
                <input type="email" placeholder="Digite seu email">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">
                <label>Confirmar senha</label>
                <input type="password" placeholder="Confirme sua senha">
                <button type="button" onclick="irPara('contaTela')">Criar conta</button>
            </form>
        </div>
    </section>

    <!-- Tela de Conta Criada -->
    <section class="tela hidden" id="contaTela">
        <div class="card">
            <div class="logo">🎮<h2>LOG</h2></div>
            <p>Conta Criada!</p>
            <button onclick="irPara('lojaTela')">Voltar para o Login</button>
        </div>
    </section>

    <!-- Tela da Loja -->
    <section class="tela hidden" id="lojaTela">
        <div class="loja">
            <div class="jogo" onclick="abrirDetalhe('hollow')">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/367520/header.jpg" alt="Hollow Knight">
                <div class="preco">R$46,99 🛒</div>
            </div>

            <div class="jogo" onclick="abrirDetalhe('celeste')">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/504230/header.jpg" alt="Celeste">
                <div class="preco">R$41,99 🛒</div>
            </div>

            <div class="jogo" onclick="abrirDetalhe('omori')">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1150690/header.jpg" alt="Omori">
                <div class="preco">R$59,99 🛒</div>
            </div>

            <div class="jogo" onclick="abrirDetalhe('stardew')">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/413150/header.jpg" alt="Stardew Valley">
                <div class="preco">R$22,99 🛒</div>
            </div>
        </div>
    </section>

    <!-- Tela de Detalhes do Jogo -->
    <section class="tela hidden" id="detalheTela">
        <div class="detalhe-card">
            <img class="banner" id="detalheBanner" src="" alt="">
            <div class="add-btn">ADD TO CART<br><span id="detalhePreco"></span></div>

            <div class="screenshots" id="detalheImgs"></div>

            <p id="detalheTexto"></p>

            <button onclick="voltarLoja()">Voltar à Loja</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
